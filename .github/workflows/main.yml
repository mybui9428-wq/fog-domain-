YAML

name: Build Fog Domain Reborn

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Upload build files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fog-domain-reborn-build
          path: |
            build/libs/*.jar
            */build/libs/*.jar
          if-no-files-found: warn
